name: Test

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      update_example_locks:
        description: 'Update example lock files before testing'
        required: false
        type: boolean
        default: false

jobs:
  update-lock-files:
    if: ${{ github.event.inputs.update_example_locks == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yaalalabs
          repositories: |
            agent-kernel
      
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv

      - name: Update example lock files
        run: |
          python scripts/update_examples_version.py --force-lock

      - name: Commit and push changes
        run: |
          git config --local user.email "agent-kernel-ci[bot]@users.noreply.github.com"
          git config --local user.name "agent-kernel-ci[bot]"
          git add examples/**/uv.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update example lock files [skip ci]"
            git push
          fi

  run-tests:
    needs: [update-lock-files]
    if: ${{ always() && (needs.update-lock-files.result == 'success' || needs.update-lock-files.result == 'skipped') }}
    uses: ./.github/workflows/test-reusable.yaml
    with:
      # For PRs, test the head SHA; for pushes, test the commit SHA
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Skip e2e tests for fork PRs (they don't have access to secrets)
      run_e2e_tests: ${{ github.event.pull_request.head.repo.fork != true || github.event_name != 'pull_request' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}

  # Publish results to the status-data branch for the public Integration Status
  # page (https://kernel.yaala.ai/status). See docs/specs/integration-status.md.
  publish-status:
    needs: [run-tests]
    if: ${{ always() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to the status-data branch
      actions: read     # read this run's job conclusions
    concurrency:
      group: status-data-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Publish status data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_DIR="${RUNNER_TEMP}/status-data"
          mkdir -p "$DATA_DIR"
          if git fetch origin status-data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$DATA_DIR"
          fi

          python3 .github/scripts/publish_integration_status.py \
            --workflow test \
            --data-dir "$DATA_DIR"

          cd "$DATA_DIR"
          git init -b status-data
          git add -A
          git -c user.name="agent-kernel-ci[bot]" \
              -c user.email="agent-kernel-ci[bot]@users.noreply.github.com" \
              commit -m "status: ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data:status-data