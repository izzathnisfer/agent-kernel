name: E2E Messaging Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        default: apply
        options:
          - apply
          - plan

permissions:
  contents: read
  id-token: write # Required for OIDC authentication with AWS

concurrency:
  group: e2e-messaging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ci-tests
    outputs:
      telegram_webhook_url: ${{ steps.tf_outputs.outputs.telegram_webhook_url }}
      slack_events_url: ${{ steps.tf_outputs.outputs.slack_events_url }}
    defaults:
      run:
        working-directory: e2e/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/${{ vars.AWS_ROLE_NAME }}
          # Resources live in us-east-2; the state bucket region is set in backend.tf.
          aws-region: us-east-2

      - name: Build deployment package
        run: |
          rm -rf dist
          mkdir -p dist/data
          uv venv
          uv export --no-hashes > requirements.txt
          uv pip install -r requirements.txt --target=dist/data
          cp app.py config.yaml dist/data
          cp deploy/Dockerfile dist/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: e2e/app/deploy
        run: terraform init -input=false

      - name: Terraform ${{ inputs.action }}
        working-directory: e2e/app/deploy
        env:
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_slack_bot_token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          TF_VAR_slack_signing_secret: ${{ secrets.E2E_SLACK_SIGNING_SECRET }}
          TF_VAR_telegram_bot_token: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_webhook_secret: ${{ secrets.E2E_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [[ "${{ inputs.action }}" == "plan" ]]; then
            terraform plan -input=false
          else
            terraform apply -input=false -auto-approve
          fi

      - name: Wait for ECS service to stabilize
        if: inputs.action == 'apply'
        run: |
          cluster="ak-e2e-dev-messaging"
          services=$(aws ecs list-services --cluster "$cluster" --region us-east-2 --query 'serviceArns' --output text)
          echo "Waiting for: $services"
          aws ecs wait services-stable --cluster "$cluster" --services $services --region us-east-2

      - name: Probe deployed webhook endpoint
        if: inputs.action == 'apply'
        working-directory: e2e/app/deploy
        run: |
          url=$(terraform output -raw telegram_webhook_url)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$url" -H "Content-Type: application/json" -d '{}')
          echo "POST $url -> HTTP $code"
          # 200 (no webhook secret) or 403 (secret enforced) both prove a healthy container;
          # 503 means no healthy ECS task behind the ALB.
          if [[ "$code" == "503" || "$code" == "500" ]]; then
            echo "Service is not healthy" >&2
            exit 1
          fi
          {
            echo "### E2E messaging deployment"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export terraform outputs
        if: inputs.action == 'apply'
        id: tf_outputs
        working-directory: e2e/app/deploy
        run: |
          echo "telegram_webhook_url=$(terraform output -raw telegram_webhook_url)" >> "$GITHUB_OUTPUT"
          echo "slack_events_url=$(terraform output -raw slack_events_url)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    environment: ci-tests
    needs: deploy
    if: inputs.action == 'apply'
    defaults:
      run:
        working-directory: e2e/tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install test dependencies
        run: uv sync

      - name: Register Telegram webhook
        env:
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.E2E_TELEGRAM_WEBHOOK_SECRET }}
        run: uv run python scripts/set_telegram_webhook.py --url "${{ needs.deploy.outputs.telegram_webhook_url }}"

      - name: Run e2e tests
        env:
          E2E_SLACK_USER_TOKEN: ${{ secrets.E2E_SLACK_USER_TOKEN }}
          E2E_SLACK_CHANNEL_ID: ${{ vars.E2E_SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TELEGRAM_BOT_USERNAME: ${{ vars.E2E_TELEGRAM_BOT_USERNAME }}
        run: uv run pytest -v -rs
