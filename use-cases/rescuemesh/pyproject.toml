[project]
name = "rescuemesh"
version = "0.1.0"
description = "Trust-aware community disaster coordination built with Agent Kernel"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agentkernel[api,cli,cron,openai,telegram]>=0.9.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=5.0.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
