[project]
name = "cli-okf-openai"
version = "0.1.0"
description = "Open Knowledge Format (OKF) example on Agent Kernel with OpenAI Agents SDK and a CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,openai]>=0.6.1",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.6.1",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0",
    "boto3-stubs[s3]>=1.34.0",
]

[tool.uv]
package = false
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4.2
constraint-dependencies = ["langchain-community<0.4.2"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Agent Kernel and the OpenAI Agents SDK ship without py.typed markers; boto3 is
# imported lazily. Don't fail type-checking on their missing stubs.
[[tool.mypy.overrides]]
module = ["agentkernel.*", "agents.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py312"]
