# Core settings
logging:
  ak:
    level: DEBUG
library_version: "0.1.0"

# Slack integration settings
# "general" handles every inbound Slack message, including a recipient's reply inside a
# conversation the agent initiated — reply-side agent selection is request-based, so the agent that
# composed the outbound message is not the one that answers the reply. Pinning it here is what
# happens by default anyway (no agent configured falls back to the first registered one), but
# leaving it implicit means re-ordering the agents would silently re-route every reply.
slack:
  agent: "general"
  agent_acknowledgement: "I'm processing your request"

# Agent-initiated conversations (the initiate_conversation system tool + reply
# resolution). Single-process REST deployments need the explicit opt-in below;
# queue-mode deployments auto-enable. The mapping store is provided by the
# session store, so it follows session.type (in-memory here).
session:
  initiation:
    enabled: true

# Optional: uncomment to also record initiated conversations as AK threads
# (readable over GET /api/v1/threads). The thread is owned by the recipient.
# thread:
#   type: memory
