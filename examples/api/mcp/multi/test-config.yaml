# Agent Kernel test harness configuration (loaded only when running tests).
# See https://kernel.yaala.ai/docs/testing/overview for details.
mode: fuzzy  # Primary comparison mode: exact, fuzzy, overlap, semantic, judge, safety, structural or human
# fallback_mode: judge  # Optional: comparison mode run when the primary mode fails
# Judge settings are used by any mode that runs an LLM-based evaluation:
judge:
  model: gpt-4o-mini
  provider: openai
  embedding_model: text-embedding-3-small
