logging:
  ak:
    level: DEBUG

# Slack integration settings
slack:
  agent: general

# Agent-initiated conversations (the initiate_conversation system tool + reply
# resolution) auto-enable in queue mode (execution.queues.input.url below is
# injected by Terraform). The mapping store follows session.type, sharing the
# session store's connection settings and a derived key prefix/TTL.

session:
  type: redis
  redis:
    prefix: "ak:scalable-openai:example:"
    url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"

execution:
  mode: rest_sync
  queues:
    input:
      url: "" # injected by Terraform via AK_EXECUTION__QUEUES__INPUT__URL
      max_receive_count: 3
    output:
      url: "" # injected by Terraform via AK_EXECUTION__QUEUES__OUTPUT__URL
      max_receive_count: 3
  response_store:
    type: redis
    redis:
      prefix: "ak:scalable-openai:response:"
      url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"
    retry_count: 5
    delay: 5

# Optional: uncomment to also record initiated conversations as AK threads
# (readable over GET /api/v1/threads). The thread is owned by the recipient.
# thread:
#   type: redis
#   redis:
#     url: ""
